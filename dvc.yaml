stages:
  download:
    cmd: python -m synthguard.stages.download
    deps:
      - src/synthguard/data/download.py
      - src/synthguard/stages/download.py
    params:
      - data.url
      - data.member
      - data.sha256
    outs:
      - data/raw/adult.data

  validate:
    cmd: python -m synthguard.stages.validate
    deps:
      - data/raw/adult.data
      - src/synthguard/data/schema.py
      - src/synthguard/data/validate.py
      - src/synthguard/stages/validate.py
    params:
      - data.min_rows
      - data.max_null_fraction
    outs:
      - reports/validation/raw.json:
          cache: false

  prepare:
    cmd: python -m synthguard.stages.prepare
    deps:
      - data/raw/adult.data
      - reports/validation/raw.json
      - src/synthguard/data/prepare.py
      - src/synthguard/data/schema.py
      - src/synthguard/stages/prepare.py
    params:
      - seed
      - data.test_size
      - data.target
    outs:
      - data/processed/train.csv
      - data/processed/holdout.csv
      - data/processed/metadata.json
      - reports/validation/processed.json:
          cache: false
    metrics:
      - metrics/prepare.json:
          cache: false

  baselines:
    cmd: python -m synthguard.stages.baselines
    deps:
      - data/processed/train.csv
      - data/processed/holdout.csv
      - data/processed/metadata.json
      - src/synthguard/generators/base.py
      - src/synthguard/generators/marginal.py
      - src/synthguard/generators/sdv_models.py
      - src/synthguard/generators/runner.py
      - src/synthguard/stages/baselines.py
    params:
      - seed
      - generators.marginal
      - generators.gaussian_copula
      - evaluation.utility
    outs:
      - models/marginal.pkl
      - models/gaussian_copula.pkl
      - data/synthetic/marginal.csv
      - data/synthetic/gaussian_copula.csv
      - metrics/runs_baselines.json:
          cache: false
    metrics:
      - metrics/baselines.json:
          cache: false

  generate:
    cmd: python -m synthguard.stages.generate
    deps:
      - data/processed/train.csv
      - data/processed/holdout.csv
      - data/processed/metadata.json
      - metrics/baselines.json
      - src/synthguard/generators/base.py
      - src/synthguard/generators/sdv_models.py
      - src/synthguard/generators/runner.py
      - src/synthguard/stages/generate.py
    params:
      - seed
      - generators.ctgan
      - generators.tvae
    outs:
      - models/ctgan.pkl
      - models/tvae.pkl
      - data/synthetic/ctgan.csv
      - data/synthetic/tvae.csv
      - metrics/runs_primary.json:
          cache: false
    metrics:
      - metrics/primary.json:
          cache: false
