name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (CPU torch + pinned lock file, same as the Docker image)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "$(grep -E '^torch==' requirements.lock)" \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch==' requirements.lock > /tmp/req.txt
          .venv/bin/pip install -r /tmp/req.txt
          .venv/bin/pip install --no-deps -e .

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Smoke pipeline (1,000 rows, 1 epoch, throwaway MLflow DB)
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/mlflow.db
        run: |
          make smoke
          .venv/bin/dvc metrics show
