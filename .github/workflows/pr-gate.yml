name: PR gate

# Every pull request: data validation + evaluation gate on the model the PR would deploy.
# PRs that change the classifier, params or pipeline also retrain a candidate and gate it.
# The benchmark is always the base branch's metrics/classifier.json, so a PR cannot lower its own
# bar (rollback/* PRs restore an earlier approved model with its benchmark). Lint and unit tests
# run in ci.yml. A failed gate marks the PR BLOCKED; deploy.yml runs the same gate on main, so a
# worse model is never deployed.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Data validation + eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (CPU torch + pinned lock file)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "$(grep -E '^torch==' requirements.lock)" \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch==' requirements.lock > /tmp/req.txt
          .venv/bin/pip install -r /tmp/req.txt
          .venv/bin/pip install --no-deps -e .
      - name: Data validation (download -> pandera validate -> prepare)
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/dvc repro prepare
      - name: Production benchmark = the base branch's (a PR cannot lower its own bar)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$HEAD_REF" == rollback/* ]]; then
            # A rollback restores an earlier approved model together with its own benchmark.
            cp metrics/classifier.json benchmark.json
            echo "benchmark: restored with the rollback (from this PR)" | tee benchmark_source.txt
          else
            git show "origin/$BASE_REF:metrics/classifier.json" > benchmark.json
            echo "benchmark: $BASE_REF (production)" | tee benchmark_source.txt
          fi
      - name: Eval gate on the model this PR would deploy (deploy/model)
        id: deployed
        run: |
          set +e
          .venv/bin/python scripts/eval_gate.py --candidate deploy/model/classifier.joblib \
            --benchmark benchmark.json --summary gate_deployed.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Does this PR change the model pipeline?
        id: scope
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(params\.yaml|dvc\.yaml|src/synthguard/(serving/classifier|stages|generators|evaluation|data)/?)'; then
            echo "retrain=true" >> "$GITHUB_OUTPUT"
          else
            echo "retrain=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retrain a candidate with this PR's code (full pipeline)
        if: steps.scope.outputs.retrain == 'true'
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/candidate.db
        run: |
          make reproduce
          .venv/bin/python scripts/export_models.py --out "${{ runner.temp }}/candidate"
      - name: Eval gate on the retrained candidate
        id: retrained
        if: steps.scope.outputs.retrain == 'true'
        run: |
          set +e
          .venv/bin/python scripts/eval_gate.py \
            --candidate "${{ runner.temp }}/candidate/classifier.joblib" \
            --benchmark benchmark.json --summary gate_retrained.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Report on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Deployed model (\`deploy/model\`)"; cat benchmark_source.txt 2>/dev/null; echo
            cat gate_deployed.md 2>/dev/null || echo "not run"
            if [ -f gate_retrained.md ]; then echo; echo "### Retrained candidate"; cat gate_retrained.md; fi
          } > gate_report.md
          cat gate_report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file gate_report.md || true
      - name: Block if a gate failed
        run: |
          if [ "${{ steps.deployed.outputs.exit }}" != "0" ]; then echo "::error::deployed model blocked by the eval gate"; exit 1; fi
          if [ "${{ steps.retrained.outputs.exit }}" = "1" ]; then echo "::error::retrained candidate blocked by the eval gate"; exit 1; fi
          echo "eval gate passed"
