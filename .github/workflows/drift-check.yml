name: Drift check

# Runs the Evidently drift check against the live API's recent requests.
# - reports the result to the API (Prometheus gauges / Grafana) when SYNTHGUARD_DRIFT_TOKEN is set
# - on an alert, sends repository_dispatch "drift-alert", which starts the retraining workflow
# - uploads the HTML report as an artifact
# Manual only: a sleeping free instance has an empty request buffer, so a timer would mostly
# check nothing.
on:
  workflow_dispatch:
    inputs:
      url:
        description: API base URL
        default: https://synthguard-ops.onrender.com
      dispatch:
        description: Start retraining (repository_dispatch drift-alert) on an alert
        type: boolean
        default: true

permissions:
  contents: write  # repository_dispatch with GITHUB_TOKEN

concurrency:
  group: drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (CPU torch + pinned lock file)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "$(grep -E '^torch==' requirements.lock)" \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch==' requirements.lock > /tmp/req.txt
          .venv/bin/pip install -r /tmp/req.txt
          .venv/bin/pip install --no-deps -e .
      - name: Reference data (download -> pandera validate -> prepare)
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/dvc repro prepare
      - name: Wake the service
        run: .venv/bin/python scripts/smoke_test_api.py --url "${{ inputs.url }}" --wait 180
      - name: Drift check
        id: drift
        env:
          SYNTHGUARD_DRIFT_TOKEN: ${{ secrets.SYNTHGUARD_DRIFT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags="--report"
          if [ "${{ inputs.dispatch }}" = "true" ]; then flags="$flags --dispatch"; fi
          set +e
          .venv/bin/python scripts/check_drift.py --url "${{ inputs.url }}" $flags
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi
      - name: Summary
        if: always() && hashFiles('reports/drift/drift.json') != ''
        run: |
          {
            if [ "${{ steps.drift.outputs.exit }}" = 3 ]; then echo "## Drift ALERT"; else echo "## No drift alert"; fi
            echo '```json'; cat reports/drift/drift.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: reports/drift/
          if-no-files-found: ignore
