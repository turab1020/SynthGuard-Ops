name: Deploy

# Every push to main: tests + data validation + eval gate + serving-image smoke test.
# Only if all pass, Render's deploy hook is called. Render auto-deploy stays off.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Tests, data validation and eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (CPU torch + pinned lock file)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "$(grep -E '^torch==' requirements.lock)" \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch==' requirements.lock > /tmp/req.txt
          .venv/bin/pip install -r /tmp/req.txt
          .venv/bin/pip install --no-deps -e .
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Data validation (download -> pandera validate -> prepare)
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/dvc repro prepare
      - name: Eval gate (deployed model vs production benchmark, fixed hold-out)
        run: |
          .venv/bin/python scripts/eval_gate.py --candidate deploy/model/classifier.joblib \
            --summary gate.md
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Serving image builds and answers within 512 MB
        run: |
          docker build -f Dockerfile.serve -t synthguard-serve:ci .
          docker run -d --name serve --memory=512m -e PORT=10000 -p 10000:10000 synthguard-serve:ci
          .venv/bin/python scripts/smoke_test_api.py --url http://localhost:10000 --wait 60
          docker stats --no-stream --format 'memory: {{.MemUsage}}' serve
          docker rm -f serve

  deploy:
    name: Trigger Render deploy and verify the live service
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVICE_URL: ${{ vars.RENDER_SERVICE_URL || 'https://synthguard-ops.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Call the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK secret not set; skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null -w "deploy hook HTTP %{http_code}\n"
      - name: Wait until the live service runs this commit (or a later one on main)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          [ -z "$RENDER_DEPLOY_HOOK" ] && exit 0
          # A later push to main may deploy before this run checks; that also contains this commit.
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 60 "$SERVICE_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit') or '')" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live service runs $GITHUB_SHA"; exit 0; fi
            if [ -n "$live" ]; then
              git fetch -q origin main
              if git cat-file -e "$live^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$live"; then
                echo "live service runs $live, a later commit on main that includes $GITHUB_SHA"; exit 0
              fi
            elif [ "$i" -gt 1 ]; then
              echo "::notice::/health reports no commit"
            fi
            sleep 20
          done
          echo "::error::live service did not switch to $GITHUB_SHA (or a later commit) within 20 minutes"; exit 1
      - name: Smoke-test the live service
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          [ -z "$RENDER_DEPLOY_HOOK" ] && exit 0
          python3 scripts/smoke_test_api.py --url "$SERVICE_URL" --wait 180
