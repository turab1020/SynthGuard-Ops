# Local observability demo: docker compose -f docker-compose.monitoring.yml up --build
#   API         http://localhost:8000/docs   (same image as Render, /generate off)
#   Prometheus  http://localhost:9090        (scrapes the local API and the live Render service)
#   Grafana     http://localhost:3000        (dashboard "SynthGuard serving", anonymous viewer)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: synthguard-serve:latest
    environment:
      PORT: "8000"
      SYNTHGUARD_REQUEST_LOG: /logs/requests.jsonl
    volumes:
      - ./monitoring/logs:/logs
    ports:
      - "8000:8000"
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/synthguard.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
