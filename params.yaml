seed: 42
data:
  url: https://archive.ics.uci.edu/static/public/2/adult.zip
  member: adult.data
  sha256: "5b00264637dbfec36bdeaab5676b0b309ff9eb788d63554ca0a249491c86603d"
  target: income
  test_size: 0.30
  min_rows: 30000
  max_null_fraction: 0.10
generators:
  marginal: {}
  gaussian_copula: {}
  ctgan: {epochs: 100, batch_size: 500}
  tvae: {epochs: 100, batch_size: 500}
evaluation:
  utility:
    random_forest: {n_estimators: 200, max_depth: null}
    xgboost: {n_estimators: 300, max_depth: 6, learning_rate: 0.1}
  privacy:
    mia_sample_size: 2000
selection:
  weights: {quality: 0.5, utility: 0.5}
  gate: {mia_auc_max: 0.60, exact_match_max: 0.01}
  # scores within this of the best (among gate-passers) count as tied; fastest to train wins.
  # 0.02 = the reproducibility tolerance; measured arm64 vs x86_64 drift was 0.0087.
  tie_tolerance: 0.02
# serving classifier (D2): XGBoost trained only on the champion generator's synthetic data
classifier: {n_estimators: 300, max_depth: 6, learning_rate: 0.1}
# evaluation gate (D2): a candidate classifier is blocked if its hold-out ROC-AUC drops more
# than this below the production benchmark (metrics/classifier.json)
gate: {max_drop: 0.01}
# drift monitoring (D2): Evidently on recent API requests vs a sample of the real train split.
# Alert when this share of the 14 input columns drifts, or the predicted probability drifts.
# Measured: normal traffic 1-2 of 14 columns drift by chance (0.07-0.14); shifted 4-5 (0.29-0.36).
drift: {threshold: 0.25, reference_rows: 5000, window: 1000, min_requests: 100}
smoke:
  rows: 1000
  epochs: 1
